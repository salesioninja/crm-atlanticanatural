# ==============================================================================
# CONFIGURAÇÃO NGINX HOST VPS: crmatlanticanatural.acessaronline.com.br
# Arquivo: /etc/nginx/sites-available/crmatlanticanatural.acessaronline.com.br
# ==============================================================================

server {
    listen 80;
    listen [::]:80;
    server_name crmatlanticanatural.acessaronline.com.br;

    # Logs
    access_log /var/log/nginx/crmatlantica_access.log;
    error_log /var/log/nginx/crmatlantica_error.log;

    client_max_body_size 64M;

    # Encaminha todo o tráfego para a porta 8095 do container Docker
    location / {
        proxy_pass http://127.0.0.1:8095;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;

        # WebSockets e conexões persistentes
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
}
